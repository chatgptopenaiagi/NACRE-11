[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nacre11"
version = "0.1.0"
description = "An experimental programming language for composing and verifying software capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Nacre-11 contributors"}]
keywords = ["programming-language", "dataflow", "interpreter", "capabilities"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]

[project.scripts]
nacre = "nacre.cli:main"

[project.urls]
Homepage = "https://github.com/chatgptopenaiagi/NACRE-11"
Documentation = "https://github.com/chatgptopenaiagi/NACRE-11/blob/main/GETTING-STARTED.md"
Issues = "https://github.com/chatgptopenaiagi/NACRE-11/issues"
Releases = "https://github.com/chatgptopenaiagi/NACRE-11/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
